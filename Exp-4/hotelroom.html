<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp-4</title>
</head>
<body>
    <h1>Hotel Room Booking Form</h1>
    <form action="#" method="post">
        <label>Full Name:</label>
        <input type="text" id="fullname" required >
        <br><br>
<label for="email">Email:</label>
        <input type="email" id="email" required>
        <br><br>
        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" required>
        <br><br>
        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" required>
        <br><br>
        <!-- Room Type -->
        <label for="room">Room Type:</label>
        <select id="room" required>
            <option value="">Single Room</option>
            <option value="single">Double Room</option>
            <option value="double">Deluxe Room</option>
            <option value="suite">Suite</option>
        </select>
        <br><br>
        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" min="1" max="4" required>
        <br><br>
        <label for="Special_requests">Special Requests:</label>
        <br><br>
        <textarea id="Special_requests" rows="4" cols="50"></textarea>
        <br><br>
        <input type="submit" value="Submit Now">
        <input type="reset" value="Reset">
        </form>
        <br><br>
        </body>
</html>
